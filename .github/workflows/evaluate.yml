name: weekly evaluation

# 每周定时评测能力单元并发布排行榜。
# 安全设计：
#   - evaluate-all 执行不可信第三方代码，该步骤【不持有任何密钥】
#   - gen-probes / model-compat 不执行服务器代码（只读已存结果 + 调模型 API），
#     密钥以【步骤级 env】注入，且在这些步骤内没有不可信代码运行
#   - 提交信息不含 [skip ci]——pages 发布在本工作流内完成

on:
  schedule:
    - cron: "17 2 * * 0"   # 每周日 02:17 UTC（避开整点）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: evaluate-publish
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # 冷缓存下评测慢的根因是 npx 串行下载（每包 15–60s × 100+ 包）。
      # 先并行预暖 npm 缓存（同样执行不可信 npx 包，本步骤不含任何密钥），
      # 评测阶段便全部命中缓存，下载只发生这一次并随 ~/.npm 缓存落库。
      - name: Pre-warm npm cache (no secrets in this step)
        timeout-minutes: 15
        run: |
          python - <<'PY' > /tmp/npx_pkgs.txt
          import json
          data = json.load(open("data/servers.json", encoding="utf-8"))
          pkgs = set()
          for s in data["servers"]:
              if not s.get("enabled", True):
                  continue
              args = s.get("args", [])
              if s.get("command") == "npx" and "-y" in args:
                  pkgs.add(args[args.index("-y") + 1])
          print("\n".join(sorted(pkgs)))
          PY
          xargs -P 12 -n 1 -a /tmp/npx_pkgs.txt \
            bash -c 'timeout --kill-after=15s 120 npx -y "$0" --version >/dev/null 2>&1 || true'

      # 智能探针：用 DeepSeek-V4 Flash 从【已评测结果】的工具 schema 生成真实调用参数，
      # 使功能性维度反映真实可用性（纯 dummy 参数会让文件/HTTP 类工具被误判不可用）。
      # 安全级别与 model-compat 相同：本步骤持 key，但只读结果 + 调模型 API，
      # 【不执行任何不可信服务器代码】；工具元数据可能投毒 prompt，
      # 模型输出经正则安全护栏清洗后才落盘（data/probes.json）。
      - name: Generate smart probe args (no untrusted code)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        timeout-minutes: 30
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "OPENCODE_API_KEY 未配置，跳过智能探针生成（evaluate 将退化为 dummy 参数）"
          else
            python -m trustlens gen-probes --real --workers 10
          fi

      # 只重测健康服务器（已失败的保持原样）。缓存被预暖后，本步骤基本只花纯评测时间。
      - name: Run evaluation (no secrets in this step)
        timeout-minutes: 90
        run: python -m trustlens evaluate-all --skip-f --timeout 90 --workers 4

      # 真实模型工具调用准确率（DeepSeek-V4 Flash）。密钥仅注入本步骤。
      - name: Update model tool-call accuracy
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        timeout-minutes: 30
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "OPENCODE_API_KEY 未配置，跳过模型兼容评测"
          else
            python -m trustlens model-compat --real --workers 10
          fi

      - name: Build static site
        run: |
          python -m pip install --quiet pillow
          python -m trustlens build-site

      - name: Commit results and built site
        run: |
          git config user.name "trustlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/results/ data/skills/ site/dist/ data/probes.json
          git diff --cached --quiet || git commit -m "data+site: weekly evaluation and site build"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
