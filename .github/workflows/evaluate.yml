name: weekly evaluation

# 每周定时评测能力单元并发布排行榜。
# 安全设计：
#   - evaluate-all 执行不可信第三方代码，该步骤【不持有任何密钥】
#   - model-compat 不执行服务器代码（只读已存结果 + 调模型 API），
#     密钥以【步骤级 env】注入，且在该步骤内没有不可信代码运行
#   - 提交信息不含 [skip ci]——pages 发布在本工作流内完成

on:
  schedule:
    - cron: "17 2 * * 0"   # 每周日 02:17 UTC（避开整点）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: evaluate-publish
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # 只重测健康服务器（已失败的保持原样），显著缩短周更时长
      - name: Run evaluation (no secrets in this step)
        timeout-minutes: 45
        run: python -m trustlens evaluate-all --skip-f --timeout 90 --workers 4

      # 真实模型工具调用准确率（DeepSeek-V4 Flash）。密钥仅注入本步骤。
      - name: Update model tool-call accuracy
        if: ${{ secrets.OPENCODE_API_KEY != '' }}
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        timeout-minutes: 30
        run: python -m trustlens model-compat --real --workers 6

      - name: Build static site
        run: python -m trustlens build-site

      - name: Commit results and built site
        run: |
          git config user.name "trustlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/results/ data/skills/ site/dist/
          git diff --cached --quiet || git commit -m "data+site: weekly evaluation and site build"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
