name: weekly evaluation

# 每周定时评测所有能力单元，把结果数据提交回仓库。
# 安全设计：本任务评测不可信第三方代码，因此【不配置任何密钥】。
# 真实模型 provider 的 API key 未来如需接入，放在独立的、不执行第三方代码的任务中。

on:
  schedule:
    - cron: "17 2 * * 0"   # 每周日 02:17 UTC（避开整点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run evaluation (no secrets in this job)
        run: python -m trustlens evaluate-all

      - name: Commit results
        run: |
          git config user.name "trustlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/results/
          git diff --cached --quiet || git commit -m "data: weekly evaluation results [skip ci]"
          git push
