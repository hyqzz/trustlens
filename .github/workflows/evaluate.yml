name: weekly evaluation

# 每周定时评测所有能力单元，把结果数据提交回仓库并重新发布排行榜。
# 安全设计：评测任务执行不可信第三方代码，因此【不配置任何密钥】。
# 真实模型 provider 的 API key 未来如需接入，放在独立的、不执行第三方代码的任务中。
# 注意：GITHUB_TOKEN 推送不会触发其他工作流，所以本站发布必须在本工作流内完成。

on:
  schedule:
    - cron: "17 2 * * 0"   # 每周日 02:17 UTC（避开整点）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: evaluate-publish
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('data/servers.json') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Run evaluation (no secrets in this job)
        run: python -m trustlens evaluate-all --timeout 150 --workers 4

      - name: Build static site
        run: python -m trustlens build-site

      - name: Commit results and built site
        run: |
          git config user.name "trustlens-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/results/
          git add -f site/dist/
          git diff --cached --quiet || git commit -m "data+site: weekly evaluation and site build"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publish:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

