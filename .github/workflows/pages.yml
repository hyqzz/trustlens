name: deploy leaderboard

# 网站生成代码变更时重建排行榜。
# 注意：每周评测后的发布在 evaluate.yml 内完成
# （GITHUB_TOKEN 推送不触发工作流，不能依赖 data/results 的 push 事件）。

on:
  push:
    branches: [main]
    paths:
      - "trustlens/site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: python -m trustlens build-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
