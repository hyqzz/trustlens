name: tests

on:
  push:
    branches: [main]
    paths:
      - "trustlens/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v
