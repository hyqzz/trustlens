# ============================================
# TrustLens 排行榜 — trustlens.icodestar.net
# Agent 能力生态信任基准（静态双语站点）
# ============================================
server {
    listen 80;
    listen [::]:80;
    server_name trustlens.icodestar.net;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trustlens.icodestar.net;

    ssl_certificate     /etc/nginx/ssl/icodestar.net-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/icodestar.net-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /opt/trustlens;
    index index.html;

    # 榜单页每周更新：短缓存，兼顾 SEO 抓取与新鲜度
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # sitemap / robots 允许稍长缓存
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/ld+json application/xml text/plain;

    access_log /var/log/nginx/trustlens-access.log main;
    error_log  /var/log/nginx/trustlens-error.log;
}
