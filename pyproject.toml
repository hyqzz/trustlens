[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens"
version = "0.1.0"
description = "Trust benchmark for the agent capability ecosystem: automated quality & trust scores for MCP servers and agent skills."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "trustlens maintainers" }]
keywords = ["mcp", "agent", "llm", "benchmark", "trust", "evaluation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
trustlens = "trustlens.cli:main"

[tool.setuptools]
packages = ["trustlens"]
